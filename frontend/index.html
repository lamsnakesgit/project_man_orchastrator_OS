<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f111a">
    <title>AI Orchestrator OS — Symphony Kanban</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d14;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover: rgba(255, 255, 255, 0.07);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --column-bg: rgba(18, 22, 34, 0.7);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.12), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.12), transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 28px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 13, 20, 0.8);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: white;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(90deg, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .btn-add {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
        }

        .btn-add:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
        }

        .board {
            display: flex;
            gap: 20px;
            padding: 24px;
            flex: 1;
            overflow-x: auto;
        }

        .column {
            background: var(--column-bg);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
            min-width: 320px;
            max-width: 400px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            height: calc(100vh - 120px);
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
        }

        .column-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .count-tag {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }

        .task-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-card:hover {
            background: var(--card-hover);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .task-id {
            font-size: 0.75rem;
            font-family: monospace;
            color: var(--accent-purple);
            font-weight: 600;
        }

        .task-prompt {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #e2e8f0;
            word-break: break-word;
        }

        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pr-link {
            color: #60a5fa;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .pr-link:hover {
            text-decoration: underline;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #141824;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
        }

        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-purple);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-group">
            <div class="logo-icon">⚡</div>
            <div>
                <h1>AI Orchestrator OS</h1>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Symphony Agent Task Queue</div>
            </div>
        </div>
        <div class="header-actions">
            <div class="status-badge">
                <div class="status-dot"></div>
                VPS Worker Active (24/7)
            </div>
            <button class="btn-add" onclick="createTask()">+ Поставить задачу</button>
        </div>
    </header>

    <div class="board">
        <div class="column">
            <div class="column-header">
                <div class="column-title">🔴 В очереди <span class="count-tag" id="count-todo">0</span></div>
            </div>
            <div class="task-list" id="col-todo"></div>
        </div>
        
        <div class="column">
            <div class="column-header">
                <div class="column-title">🟡 В работе <span class="count-tag" id="count-inprogress">0</span></div>
            </div>
            <div class="task-list" id="col-inprogress"></div>
        </div>

        <div class="column">
            <div class="column-header">
                <div class="column-title">🟢 Выполнено <span class="count-tag" id="count-done">0</span></div>
            </div>
            <div class="task-list" id="col-done"></div>
        </div>
    </div>

    <div class="modal-overlay" id="taskModal">
        <div class="modal-content">
            <div class="modal-title">Новая задача для ИИ-оркестратора</div>
            <textarea id="taskPrompt" rows="5" placeholder="Опишите задачу (например: Создать REST API авторизации пользователей с JWT #web #task)..."></textarea>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn-add" onclick="submitTask()">Запустить воркера</button>
            </div>
        </div>
    </div>

    <script>
        async function fetchTasks() {
            try {
                const response = await fetch('/tasks/all');
                const data = await response.json();
                renderTasks(data.tasks);
            } catch (e) {
                console.error("Ошибка обновления:", e);
            }
        }

        function renderTasks(tasks) {
            const colTodo = document.getElementById('col-todo');
            const colInProgress = document.getElementById('col-inprogress');
            const colDone = document.getElementById('col-done');

            colTodo.innerHTML = '';
            colInProgress.innerHTML = '';
            colDone.innerHTML = '';

            let cTodo = 0, cProgress = 0, cDone = 0;

            if(!tasks) return;

            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'task-card';

                const prElement = task.pr_url 
                    ? `<a href="${task.pr_url}" target="_blank" class="pr-link">🔀 GitHub PR</a>` 
                    : `<span>Ветка: ${task.branch || 'main'}</span>`;

                card.innerHTML = `
                    <div class="task-id">#${task.id.substring(0, 8)}</div>
                    <div class="task-prompt">${escapeHtml(task.prompt)}</div>
                    <div class="task-footer">
                        <span>${new Date(task.created_at || Date.now()).toLocaleTimeString()}</span>
                        ${prElement}
                    </div>
                `;

                if(task.status === 'queued') {
                    colTodo.appendChild(card);
                    cTodo++;
                } else if(task.status === 'processing' || task.status === 'in_progress') {
                    colInProgress.appendChild(card);
                    cProgress++;
                } else {
                    colDone.appendChild(card);
                    cDone++;
                }
            });

            document.getElementById('count-todo').innerText = cTodo;
            document.getElementById('count-inprogress').innerText = cProgress;
            document.getElementById('count-done').innerText = cDone;
        }

        function escapeHtml(text) {
            if(!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function createTask() {
            document.getElementById('taskModal').style.display = 'flex';
            document.getElementById('taskPrompt').focus();
        }

        function closeModal() {
            document.getElementById('taskModal').style.display = 'none';
            document.getElementById('taskPrompt').value = '';
        }

        async function submitTask() {
            const prompt = document.getElementById('taskPrompt').value.trim();
            if(!prompt) return;
            
            closeModal();
            try {
                await fetch('/tasks', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: prompt})
                });
                fetchTasks();
            } catch(e) {
                alert("Ошибка создания задачи!");
            }
        }

        setInterval(fetchTasks, 3000);
        fetchTasks();
    </script>
</body>
</html>
